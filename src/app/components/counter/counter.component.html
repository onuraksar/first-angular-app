<p class="counter">Counter: {{counterValue()}}</p>
<div class="counter-buttons">
    <button (click)= "decrement()">Decrement -</button>
    <button (click)= "reset()">Reset</button>
    <button (click)= "increment()">Increment +</button>
</div>


<div class="counter-checkbox-wrapper">
    <span>is below zero enabled: {{isBelowZeroEnabled()}} </span>
    <input type="checkbox" (click)="toggleBelowZero()" checked="isBelowZeroEnabled()" />
</div>
